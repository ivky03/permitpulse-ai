services:
  api:
    build: .
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      PERMITPULSE_STATE_DB: /app/artifacts/permitpulse_state.sqlite
      PERMITPULSE_REPORT_DIR: /app/artifacts/reports
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build: .
    command: streamlit run ui.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      PERMITPULSE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
